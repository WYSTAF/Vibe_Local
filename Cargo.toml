[workspace]
resolver = "2"
members = [
    "crates/vibe-local-core",
    "crates/vibe-local-engine",
    "crates/vibe-local-cli",
    "crates/vibe-local-jni",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/WYSTAF/Vibe_Local"
authors = ["Vibe Local contributors"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2.10", features = ["json"] }
url = "2"
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"
jni = "0.21"
getrandom = "0.2"
libc = "0.2"
tempfile = "3"
vibe-local-core = { path = "crates/vibe-local-core" }
vibe-local-engine = { path = "crates/vibe-local-engine" }
vibe-local-cli = { path = "crates/vibe-local-cli" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"